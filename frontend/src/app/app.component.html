<p>backendHealth: {{backendHealth}}</p>
<div class="flex-row align-items-center ">
    <div><h1>Hello, {{ title }} <sup>it can be deployed!</sup></h1></div>
    <div class="margin-left-auto">
        @if (authService.isAuthenticated()) {
            <div class="flex-row align-items-center gap-1">
                <div>{{ authService.getUser().name }}</div>
                <div>[{{ authService.getUser().roles }}]</div>
                <mft-button (onClick)="refreshToken()" label="Refresh Token"/>
                <mft-button (onClick)="logout()" label="Logout"/>
            </div>
        }
        @else {
            <div class="flex-row align-items-center gap-1">
                <mft-input-text placeholder="name" [(ngModel)]="creds.name"/>
                <mft-password placeholder="password" [(ngModel)]="creds.password"/>
                <mft-button (onClick)="login(creds.name, creds.password)" label="Login"/>
            </div>
        }
    </div>
</div>

<div class="flex-row align-items-center gap-1">
    <p-button label="Refresh Token" (onClick)="refreshToken()" />
    <mft-button severity="danger" [loading]="isBtnLoading" (onClick)="testClick()"></mft-button>
    <p-checkbox [(ngModel)]="checked" [binary]="true" />
    <span>{{checked ? 'Yes' : 'No'}}</span>
</div>
<br>
<nav class="router-links topbar">
    <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">login</a>
    <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">admin</a>
    <a routerLink="/access-denied" routerLinkActive="active" ariaCurrentWhenActive="page">access-denied</a>
</nav>
